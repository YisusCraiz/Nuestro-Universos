const box=document.querySelector('aside'),panel=document.querySelector('section'),avatar=document.querySelector('#avatar'),size=document.querySelector('#size');
let start,drag=false;
avatar.onpointerdown=e=>{if(!e.isPrimary || e.button!==0)return;const b=box.getBoundingClientRect();start={id:e.pointerId,x:e.clientX,y:e.clientY,left:b.left,top:b.top};drag=false;avatar.setPointerCapture(e.pointerId)};
avatar.onpointermove=e=>{if(start?.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5)drag=true;if(drag){box.style.right=box.style.bottom='auto';box.style.left=Math.max(0,Math.min(innerWidth-box.offsetWidth,start.left+dx))+'px';box.style.top=Math.max(0,Math.min(innerHeight-box.offsetHeight,start.top+dy))+'px'}};
avatar.onpointerup=avatar.onpointercancel=e=>{if(start?.id===e.pointerId)start=null};
function fit(){const b=box.getBoundingClientRect();if(b.bottom>innerHeight){box.style.top='auto';box.style.bottom='0'}if(b.right>innerWidth){box.style.left='auto';box.style.right='0'}}
avatar.onclick=e=>{if(!drag||!e.detail){panel.hidden=!panel.hidden;avatar.setAttribute('aria-expanded',String(!panel.hidden));fit()}drag=false};
size.onclick=()=>{panel.hidden=true;avatar.setAttribute('aria-expanded','false');size.textContent=avatar.classList.toggle('mini')?'Restaurar':'Minimizar';fit()};onresize=fit;
</script></html>
