<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Regalos JXJ · Nuestro Universo</title>
<link rel="stylesheet" href="regalos-jxj.css?v=1">
<script src="config.js"></script>
<script src="assets/supabase.js"></script>
<main id="page">
<header class="gift-header">
 <a id="home" class="back-link" href="./#volver-regalos" data-t="back">← Atrás</a>
 <div class="gift-languages"><button id="langEs" type="button">Español</button><button id="langEn" type="button">English</button></div>
 <h1 id="heading" data-t="heading"></h1>
</header>
<nav id="giftNav" hidden aria-label="Regalos JXJ">
 <button type="button" data-view="scan" aria-controls="entry"><strong data-t="scanTab"></strong><small data-t="scanNavHint"></small></button>
 <button type="button" data-view="create" aria-controls="editor" hidden><strong data-t="createTab"></strong><small data-t="createNavHint"></small></button>
 <button type="button" data-view="mine" aria-controls="collection"><strong data-t="gifts"></strong><small data-t="mineNavHint"></small></button>
</nav>
<p id="status" role="status" aria-live="polite"></p>
<form id="login" class="gift-panel" hidden>
 <h2 data-t="login"></h2><p class="hint" data-t="loginHint"></p>
 <label><span data-t="profile"></span><select name="profile"><option value="julisa">Julie</option><option value="jesus">Yisus</option></select></label>
 <label><span data-t="password"></span><input required name="password" type="password" autocomplete="current-password"></label>
 <button class="primary" data-t="login"></button>
</form>
<section id="entry" class="gift-panel" hidden aria-labelledby="scanHeading">
 <h2 id="scanHeading" data-t="scanTab"></h2>
 <p class="hint" data-t="scanHint"></p>
 <div class="scan-options">
  <div class="gift-card"><h3 data-t="cameraTitle"></h3>
   <p class="hint" data-t="cameraHint"></p>
   <button class="primary" id="scan" type="button" data-t="scan"></button>
   <div id="camera" hidden></div>
  </div>
  <form class="gift-card" id="lookup">
   <h3 data-t="manual"></h3>
   <label><span data-t="code"></span><input name="code" required maxlength="512" autocomplete="off" autocapitalize="characters" spellcheck="false" data-placeholder="codeExample"></label>
   <button type="submit" data-t="find"></button>
  </form>
 </div>
</section>
<article id="gift" class="gift-panel" tabindex="-1" hidden aria-labelledby="title">
 <div class="gift-from" id="senderBlock" hidden><span class="sender-mark" id="senderMark" aria-hidden="true"></span><div><small data-t="sentBy"></small><strong id="senderName"></strong><p id="senderNote"></p></div></div>
 <h2 id="title"></h2>
 <p id="sealedHint" class="hint" data-t="sealedHint" hidden></p>
 <button class="primary" id="openGift" type="button" data-t="open" hidden></button>
 <p id="letter"></p>
 <section id="attachmentLinks" hidden aria-label="JXJ"></section>
 <p id="coinsReceived" hidden></p>
 <p id="cardNote" hidden data-t="cardNote"></p>
</article>
<section id="collection" class="gift-panel" hidden><h2 data-t="gifts"></h2><p class="hint" data-t="mineNavHint"></p><div class="gift-list" id="items"></div></section>
<section id="editor" class="gift-panel" hidden>
 <div class="section-heading"><h2 data-t="editor"></h2><button id="newGift" type="button" data-t="new"></button></div>
 <details id="manageGifts"><summary data-t="manage"></summary><div class="gift-list" id="managedItems"></div></details>
 <form id="draft" novalidate>
  <ol id="draftSteps" class="draft-steps" aria-label="Progreso">
   <li data-t="stepRecipient"></li><li data-t="stepContent"></li><li data-t="stepReview"></li>
  </ol>
  <fieldset class="draft-step">
   <legend data-t="recipient"></legend>
   <label><span data-t="recipientPrompt"></span><select name="recipient"><option value="partner" id="giftPartner"></option><option value="self" data-t="self"></option></select></label>
   <p class="hint" data-t="recipientHint"></p>
   <label><span data-t="signature"></span><input name="sender_note" maxlength="80" data-placeholder="signatureExample"></label>
  </fieldset>
  <fieldset class="draft-step" hidden>
   <legend data-t="stepContent"></legend>
   <label><span data-t="title"></span><input required name="title" maxlength="120"></label>
   <label><span data-t="letter"></span><textarea required name="body" rows="5" maxlength="16000"></textarea></label>
   <label><span data-t="theme"></span><select name="theme"><option value="anniversary" data-t="anniversary"></option><option value="christmas" data-t="christmas"></option><option value="surprise" data-t="surprise"></option></select></label>
   <label><span data-t="addFiles"></span><input name="file" type="file" multiple accept="image/png,image/jpeg,image/webp,application/pdf,audio/mpeg,audio/wav,video/mp4"></label>
   <ul id="draftFiles" hidden></ul>
   <details id="extras" class="gift-card">
    <summary data-t="extras"></summary>
    <div id="giftCoins">
     <label><span data-t="coins"></span><input name="coins" type="number" min="0" step="1" max="2147483647" value="0" inputmode="numeric"></label>
     <p id="coinBalance"></p><p class="hint" data-t="coinsHint"></p>
    </div>
    <label><span data-t="card"></span><input name="card" placeholder="nu-001"></label>
   </details>
  </fieldset>
  <fieldset class="draft-step" hidden>
   <legend data-t="stepReview"></legend>
   <div id="draftPreview" class="gift-card">
    <p id="reviewFrom"></p><p id="reviewNote" class="hint"></p>
    <h3 id="reviewTitle"></h3><p id="reviewBody"></p>
    <ul id="reviewDetails"></ul>
   </div>
   <details class="gift-card" id="deliverySettings">
    <summary data-t="deliverySettings"></summary>
    <label><span data-t="date"></span><input type="datetime-local" name="date"></label>
    <label><span data-t="custom"></span><input name="code" maxlength="36" pattern="[A-Za-z0-9\-]{6,36}" autocomplete="off"></label>
   </details>
   <label class="enable-gift"><input name="enabled" type="checkbox"><span data-t="enabled"></span></label>
   <p class="hint" id="enabledHint"></p>
  </fieldset>
  <div class="gift-actions wizard-actions">
   <button id="previousStep" type="button" data-t="previous" hidden></button>
   <button id="draftNext" class="primary" type="submit" data-t="next"></button>
  </div>
 </form>
 <section id="print" class="print-panel" hidden tabindex="-1">
  <h3 data-t="print"></h3><p class="hint" id="shareHint"></p>
  <output id="printedCode"></output>
  <div class="gift-actions">
   <button id="copyCode" type="button" data-t="copyCode"></button>
   <button id="copyLink" type="button" data-t="copyLink"></button>
   <a id="giftLink" target="_blank" rel="noopener" data-t="openLink"></a>
  </div>
  <input id="copyFallback" readonly hidden>
  <p id="printStatus" role="status"></p>
  <div class="code-art"><div id="qr"></div><svg id="bars" aria-label="Code 128"></svg></div>
  <div class="gift-actions">
   <button id="downloadQr" type="button" data-t="downloadQr" disabled></button>
   <button id="downloadBars" type="button" data-t="downloadBars" disabled></button>
   <button id="resumeEdit" type="button" data-t="edit"></button>
  </div>
 </section>
</section>
</main>
<script>
'use strict';

const tr = {

  stepRecipient:['Destinatario','Recipient'], stepContent:['Contenido','Contents'], stepReview:['Vista previa','Preview'],
  stepsLabel:['Pasos para crear el regalo','Gift creation steps'],

  reviewDate:['Se podrá abrir desde','Available from'],

  draftHint:['Puedes guardar y preparar el QR. Habilita el regalo cuando quieras entregarlo.','You can save now and prepare the QR. Enable the gift when you’re ready to give it.'],

  copyCode:['Copiar código','Copy code'], copyLink:['Copiar enlace','Copy link'],
  openLink:['Abrir enlace','Open link'], copied:['Copiado.','Copied.'],

 sentBy:['Un regalo de','A gift from'], signature:['Dedicatoria en el sobre (opcional)','Envelope note (optional)'],
 signatureExample:['P. ej. De tu compañero de aventuras','E.g. From your adventure partner'],
 fileHeading:['Dentro del regalo','Inside your gift'], image:['Imagen','Image'], pdf:['PDF','PDF'],
 download:['Descargar','Download'], viewFile:['Abrir','Open'], addComic:['Guardar PDF en Cómics','Save PDF to Comics'],
 addPages:['Guardar imágenes como páginas de cómic','Save images as comic pages'],
 savedComic:['Guardado en tus Cómics','Saved to your Comics'], openComics:['Ir a Cómics','Go to Comics'],
 coins:['Monedas JJ para regalar','JJ coins to gift'],
 coinsHint:['Al habilitar el regalo se apartan las monedas. Si lo deshabilitas antes del canje, vuelven a tu saldo.','Coins are set aside when you enable the gift. Disable it before redemption to get them back.'],
 availableCoins:['Saldo disponible','Available balance'],
 receivedCoins:['Monedas JJ recibidas','JJ coins received'],

 recipient:['Destinatario','Recipient'], self:['Mi cuenta','My account'], noDrafts:['Todavía no has preparado regalos.','You have not created any gifts yet.'],
 profile:['Perfil','Profile'], password:['Contraseña','Password'], login:['Iniciar sesión','Sign in'],
 heading:['Regalos secretos','Secret gifts'], code:['Código del regalo','Gift code'], find:['Buscar regalo','Find gift'],
 scan:['Abrir cámara','Open camera'], stop:['Cerrar cámara','Close camera'],
 open:['Abrir mi regalo','Open my gift'], attachment:['Archivo adjunto','Attachment'],
 cardNote:['Carta entregada en Álbum JJ.','Card delivered to Album JJ.'], gifts:['Mis regalos','My gifts'],
 editor:['Preparar un regalo','Prepare a gift'], new:['Nuevo regalo','New gift'],
 title:['Título','Title'], letter:['Carta o mensaje','Letter or message'], theme:['Tema','Theme'],
 anniversary:['Aniversario','Anniversary'], christmas:['Navidad','Christmas'], surprise:['Sorpresa','Surprise'],
 custom:['Código manual personalizado (opcional)','Custom manual code (optional)'], card:['ID de carta de Álbum JJ (opcional)','Album JJ card ID (optional)'],
 addFiles:['Añadir archivos adjuntos','Add attachments'], remove:['Quitar','Remove'],
 fileTooLarge:['Cada archivo debe pesar como máximo 20 MB.','Each attachment must be 20 MB or less.'], date:['Abrir a partir de (hora local)','Available from (local time)'],
 enabled:['Permitir que el destinatario lo abra','Let the recipient open it'], save:['Guardar y ver QR','Save and view QR'],
 print:['Compartir regalo','Share gift'], downloadQr:['Descargar QR PNG','Download QR PNG'],
 downloadBars:['Descargar barras SVG','Download barcode SVG'], sealed:['Un regalo para ti','A gift for you'],
 unavailable:['El regalo aún no está disponible para este perfil. Revisa el código y la cuenta.','The gift isn’t available for this profile yet. Check the code and account.'],
 error:['No se pudo completar. Revisa la conexión y los datos.','Could not complete. Check your connection and the details.'],
 invalid:['Revisa el código y el ID de carta. El código debe ser único.','Check the code and card ID. The code must be unique.'],
 saved:['Guardado.','Saved.'], cameraError:['La cámara no está disponible. Puedes escribir el código.','Camera unavailable. You can type the code.'],
 printError:['No se cargaron los generadores. El enlace y el código siguen disponibles.','Generators did not load. The link and code are still available.'],
 empty:['Aún no hay regalos abiertos.','No opened gifts yet.'], draft:['Borrador','Draft'], ready:['Habilitado','Enabled'], claimed:['Abierto','Opened']
};
const params = new URLSearchParams(location.hash.slice(1));
$('home').href = './#'+new URLSearchParams({ 'volver-regalos': params.get('from') || 'home' });
let code = params.get('gift') || '';
let lang = params.get('lang') === 'en' || (!params.has('lang') && (code || navigator.language.startsWith('en'))) ? 1 : 0;
let selected = null, scanner = null, generation = 0, pending = false;
let cameraWanted=false, cameraStarting=false, cameraStopping=false, draftStep=0;
let view = params.get('view') === 'create' && !code ? 'create' : 'scan';
let account = null;
let displayedGift=null;
let savedFiles=[], pickedFiles=[], draftCode='';
const uploads=new WeakMap();
const bucket = 'jj-secret-gifts';
const config = window.UNIVERSE_CONFIG;
const client = window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey);
const cachedScripts = new Map();
const t = key => tr[key][lang];
function status(key) {
  $('status').dataset.key = key;
  $('status').textContent = key ? t(key) : '';
}
function language() {
  document.documentElement.lang = lang ? 'en' : 'es';
  document.querySelectorAll('[data-t]').forEach(node => {node.textContent = t(node.dataset.t);});
  if (account) showBalance();
  const received=$('coinsReceived');
  if (!received.hidden) received.textContent=t('receivedCoins')+': '+received.dataset.amount;
  if (!$('openGift').hidden) $('title').textContent = t('sealed');
  $('langEs').setAttribute('aria-pressed',String(!lang));
  $('langEn').setAttribute('aria-pressed',String(Boolean(lang)));
  document.querySelectorAll('[data-placeholder]').forEach(node=>node.placeholder=t(node.dataset.placeholder));
  document.querySelectorAll('[data-file-text]').forEach(node=>node.textContent=t(node.dataset.fileText));
  $('copyFallback').setAttribute('aria-label',t('copyManually'));
  renderCameraButton();
  renderDraftStep();
  if (!$('print').hidden && selected) renderShareHint(selected);
  printStatus($('printStatus').dataset.key || '');
  status($('status').dataset.key || '');
}
function chooseLanguage(value){
  lang=value;language();
  if(account){drawLists();drawDraftFiles();}
}
$('langEs').onclick=()=>chooseLanguage(0);
$('langEn').onclick=()=>chooseLanguage(1);
language();
function script(url) {
  if (!cachedScripts.has(url)) cachedScripts.set(url,new Promise((resolve,reject) => {
    const tag = document.createElement('script');
    tag.src = url;
    tag.onload = resolve;
    tag.onerror = () => {cachedScripts.delete(url); tag.remove(); reject(new Error('LIBRARY'));};
    document.head.append(tag);
  }));
  return cachedScripts.get(url);
}
async function rpc(action,data={}) {
  const r = await client.rpc('jj_secret_gifts_api',{p_action:action,p_data:data});
  if (r.error) throw r.error;
  return r.data;
}
async function run(task) {
  if (pending) return;
  pending = true;
  status('');
  try { await task(); }
  catch (error) {
    status(error.message === 'INSUFFICIENT_GIFT_COINS' ? 'insufficientCoins' : error.message === 'GIFT_LOCKED' ? 'locked' :
      error.message === 'INVALID_GIFT_COINS' ? 'invalidCoins' : error.message === 'GIFT_UNAVAILABLE' ? 'unavailable' :
      error.message === 'INVALID_GIFT_CODE' ? 'malformed' :
      ['23505','23503','23514'].includes(error.code) ? 'invalid' : 'error');
  } finally { pending = false; }
}
async function showGift(gift) {
  displayedGift=gift;
  $('page').dataset.theme = gift.theme;
  $('senderBlock').hidden=!gift.sender;
  $('senderName').textContent=gift.sender || '';
  $('senderMark').textContent=gift.sender?.[0] || '';
  $('senderNote').textContent=gift.sender_note || '';
  $('gift').hidden = false;
  $('openGift').hidden = gift.redeemed !== false;
  $('sealedHint').hidden = gift.redeemed !== false;
  $('title').textContent = gift.title || t('sealed');
  $('letter').textContent = gift.body || '';
  $('cardNote').hidden = !gift.card;
  $('coinsReceived').hidden = !gift.coins;
  $('coinsReceived').dataset.amount=gift.coins || 0;
  $('coinsReceived').textContent=t('receivedCoins')+': '+(gift.coins || 0);
  const list=$('attachmentLinks');
  list.replaceChildren();
  const files=attachmentsFor(gift);
  list.hidden=!files.length;
  if(files.length)list.append(fileText('h3','fileHeading'));
  if(files.some(file=>fileKind(file)==='image'))list.append(comicPicker(gift.id,'images','addPages'));
  for(const [index,file] of files.entries()){
    const kind=fileKind(file);
    const row=document.createElement('article');
    row.className='gift-file';
    const name=file.name && !/^file_[a-f0-9]{20,}/i.test(file.name) ? file.name : '';
    const label=document.createElement('strong');
    if(name)label.textContent=name;
    else {
      const text=fileText('span',kind);
      label.append(text,' '+(index+1));
    }
    row.append(label);
    const actions=document.createElement('div');
    actions.className='gift-actions';
    row.append(actions);
    for(const action of ['viewFile','download']){
      const button=fileText('button',action);
      button.type='button';
      button.onclick=()=>run(async()=>{
        const result=await client.storage.from(bucket).createSignedUrl(file.path,300,action==='download'?{download:name || defaultFileName(file,index)}:undefined);
        if(result.error)throw result.error;
        if(action==='download')download(result.data.signedUrl,name || defaultFileName(file,index));
        else location.assign(result.data.signedUrl);
      });
      actions.append(button);
    }
    if(kind==='pdf')row.append(comicPicker(gift.id,file.path,'addComic'));
    list.append(row);
    if(kind==='image'){
      void client.storage.from(bucket).createSignedUrl(file.path,300).then(({data,error})=>{
        if(error||displayedGift!==gift||!row.isConnected)return;
        const img=document.createElement('img');
        img.src=data.signedUrl;
        img.alt=name || label.textContent;
        img.loading='lazy';
        img.onerror=()=>img.remove();
        row.prepend(img);
      }).catch(()=>{});
    }
  }
  $('gift').focus({preventScroll:true});
  $('gift').scrollIntoView({block:'start'});
}
function fileKind(file){
  if(file.mime?.startsWith('image/') || /\.(jpg|jpeg|png|webp)$/i.test(file.name || ''))return 'image';
  if(file.mime==='application/pdf' || /\.pdf$/i.test(file.name || ''))return 'pdf';
  return 'attachment';
}
function defaultFileName(file,index){
  const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf','audio/mpeg':'mp3','audio/wav':'wav','video/mp4':'mp4'};
  const extension=extensions[file.mime] || file.name?.match(/\.([a-z0-9]{1,5})$/i)?.[1] || (fileKind(file)==='pdf'?'pdf':'');
  return 'JXJ-'+(index+1)+(extension?'.'+extension:'');
}
function fileText(tag,key){
  const node=document.createElement(tag);
  node.dataset.fileText=key;
  node.textContent=t(key);
  return node;
}
function comicPicker(id,selection,key){
  const block=document.createElement('details');
  block.append(fileText('summary',key));
  const actions=document.createElement('div');
  actions.className='gift-actions';
  const saved=document.createElement('small');
  const open=fileText('a','openComics');
  open.hidden=true;
  for(const [code,label] of [['es','Español'],['en','English']]){
    const button=document.createElement('button');
    button.type='button';
    button.textContent=label;
    button.onclick=()=>run(async()=>{
      const {error}=await client.rpc('jj_received_comics_api',{p_gift:id,p_selection:selection,p_language:code});
      if(error)throw error;
      actions.querySelectorAll('button').forEach(node=>node.setAttribute('aria-pressed',String(node===button)));
      saved.dataset.fileText='savedComic';saved.textContent=t('savedComic');
      open.href='./#volver-regalos=comics&comic-lang='+code;
      open.hidden=false;
    });
    actions.append(button);
  }
  actions.append(open);
  block.append(actions,saved);
  return block;
}
function giftUrl(gift) {
  const recipientLanguage=gift.for_self ? (lang ? 'en' : 'es') : account.admin ? 'en' : 'es';
  const url=new URL(location.pathname,location.origin);
  url.hash=new URLSearchParams({gift:gift.code,lang:recipientLanguage});
  return url.href;
}
function download(href,name) {
  const anchor = document.createElement('a');
  anchor.href = href;
  anchor.download = name;
  anchor.click();
}
function printStatus(key){
  $('printStatus').dataset.key=key;
  $('printStatus').textContent=key?t(key):'';
}
function renderShareHint(gift){
  $('shareHint').textContent=t(gift.redeemed_at?'shareRedeemed':gift.enabled?'shareActive':'shareDraft');
}
async function copyGiftText(value){
  const fallback=$('copyFallback');
  fallback.hidden=true;
  try{
    await navigator.clipboard.writeText(value);
    printStatus('copied');
  }catch{
    fallback.value=value;
    fallback.hidden=false;
    fallback.select();
    printStatus('copyManually');
  }
}
async function printable(gift) {
  const job = ++generation;
  const value=gift.code;
  const url=giftUrl(gift);
  $('giftLink').href = url;
  $('printedCode').textContent = value;
  $('print').hidden = false;
  $('copyFallback').hidden=true;
  $('copyCode').onclick=()=>copyGiftText(value);
  $('copyLink').onclick=()=>copyGiftText(url);
  $('resumeEdit').hidden=Boolean(gift.redeemed_at);
  renderShareHint(gift);
  printStatus('');
  $('qr').replaceChildren();
  $('bars').replaceChildren();
  $('downloadQr').disabled = true;
  $('downloadBars').disabled = true;
  try {
    await Promise.all([
      script('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'),
      script('https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js')
    ]);
    if (job !== generation) return;
    new QRCode($('qr'),{text:url,width:384,height:384,correctLevel:QRCode.CorrectLevel.M});
    JsBarcode($('bars'),value,{format:'CODE128',width:2,height:75,margin:16});
    $('downloadQr').onclick = () => {
      const raw = $('qr').querySelector('canvas');
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,480,480);
      ctx.drawImage(raw,48,48);
      download(canvas.toDataURL('image/png'),'JXJ-'+value+'-QR.png');
    };
    $('downloadBars').onclick = () => {
      const file = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString($('bars'))],{type:'image/svg+xml'}));
      download(file,'JXJ-'+value+'-Code128.svg');
      setTimeout(() => URL.revokeObjectURL(file),1000);
    };
    $('downloadQr').disabled = !$('qr').querySelector('canvas');
    $('downloadBars').disabled = false;
  } catch { if (job === generation) printStatus('printError'); }
}
function attachmentsFor(gift){
  return gift?.attachments ?? (gift?.attachment ? [{path:gift.attachment}] : []);
}
function drawDraftFiles(){
  const list=$('draftFiles');
  list.replaceChildren();
  function append(file,index,files){
    const row=document.createElement('li');
    const remove=document.createElement('button');
    remove.type='button';
    remove.textContent=t('remove');
    const label=file.name || t('attachment')+' '+(index+1);
    remove.setAttribute('aria-label',t('remove')+' '+label);
    remove.onclick=()=>{if(!pending){files.splice(index,1);drawDraftFiles();}};
    row.append(label,' ',remove);
    list.append(row);
  }
  savedFiles.forEach((file,index)=>append(file,index,savedFiles));
  pickedFiles.forEach((file,index)=>append(file,index,pickedFiles));
  list.hidden=!list.children.length;
}
$('draft').elements.file.onchange=event=>{
  for(const file of event.target.files){
    if(file.size>20*1024*1024){status('fileTooLarge');continue;}
    if(!pickedFiles.some(item=>item.name===file.name&&item.size===file.size&&item.lastModified===file.lastModified))pickedFiles.push(file);
  }
  event.target.value='';
  drawDraftFiles();
};
function showBalance(){
  $('coinBalance').textContent=account?.balance == null ? '' : t('availableCoins')+': '+account.balance+' JJ';
}
function updateCoinField(){
  const fields=$('draft').elements;
  const self=fields.recipient.value==='self';
  $('giftCoins').hidden=self;
  fields.coins.disabled=self;
  if(self)fields.coins.value=0;
}
$('draft').elements.recipient.onchange=updateCoinField;
function renderDraftSummary(){
  const f=$('draft').elements;
  const person=account?.admin?'Yisus':'Julie';
  const recipient=f.recipient.value==='self'?person:$('giftPartner').textContent;
  $('draftPreview').dataset.theme=f.theme.value;
  $('reviewFrom').textContent=t('reviewRoute').replace('{sender}',person).replace('{recipient}',recipient);
  $('reviewNote').textContent=f.sender_note.value.trim();
  $('reviewTitle').textContent=f.title.value.trim();
  $('reviewBody').textContent=f.body.value.trim();
  const details=[
    ['reviewTheme',t(f.theme.value)],['reviewFiles',savedFiles.length+pickedFiles.length],
    ['reviewCoins',Number(f.coins.value)||0],['reviewCard',f.card.value.trim()],
    ['reviewDate',f.date.value&&f.date.validity.valid?new Date(f.date.value).toLocaleString(lang?'en-US':'es-MX'):'']
  ];
  $('reviewDetails').replaceChildren(...details.filter(([,value])=>value).map(([key,value])=>{
    const item=document.createElement('li');
    item.textContent=t(key)+': '+value;
    return item;
  }));
  $('enabledHint').textContent=t(f.enabled.checked?'activeHint':'draftHint');
}
function renderDraftStep(){
  $('draft').querySelectorAll('.draft-step').forEach((panel,i)=>{panel.hidden=i!==draftStep;});
  [...$('draftSteps').children].forEach((item,i)=>{
    if(i===draftStep)item.setAttribute('aria-current','step');
    else item.removeAttribute('aria-current');
  });
  $('draftSteps').setAttribute('aria-label',t('stepsLabel'));
  $('previousStep').hidden=draftStep===0;
  $('draftNext').dataset.t=draftStep===2?'save':'next';
  $('draftNext').textContent=t(pending&&$('draft').inert?'saving':$('draftNext').dataset.t);
  if(draftStep===2)renderDraftSummary();
}
function goToDraftStep(step,moveFocus=true){
  draftStep=step;
  renderDraftStep();
  if(moveFocus){
    const heading=$('draft').querySelector('.draft-step:not([hidden]) legend');
    heading.tabIndex=-1;
    heading.focus({preventScroll:true});
    heading.scrollIntoView({block:'nearest'});
  }
}
function validDraftStep(){
  const f=$('draft').elements;
  if(draftStep===1&&(!f.title.value.trim()||!f.body.value.trim())){
    status('missingContent');
    (f.title.value.trim()?f.body:f.title).focus();
    return false;
  }
  const fields=[[$('draft').elements.recipient],[f.title,f.body,f.coins],[f.date,f.code]][draftStep];
  const invalid=fields.find(field=>!field.validity.valid);
  if(!invalid)return true;
  const details=invalid.closest('details');
  if(details)details.open=true;
  invalid.reportValidity();
  return false;
}
function edit(gift,share=false){
  selected = gift;
  draftCode=gift?.code || '';
  const form = $('draft');
  form.reset();
  savedFiles=[...attachmentsFor(gift)];
  pickedFiles=[];
  drawDraftFiles();
  const fields = form.elements;
  fields.code.disabled = Boolean(gift);
  fields.recipient.disabled = Boolean(gift);
  fields.recipient.value = gift?.for_self ? 'self' : 'partner';
  fields.coins.value=gift?.coins || 0;
  updateCoinField();
  fields.sender_note.value = gift?.sender_note || '';
  fields.title.value = gift?.title || '';
  fields.body.value = gift?.body || '';
  fields.code.value = gift?.code || '';
  fields.card.value = gift?.card || '';
  fields.theme.value = gift?.theme || 'anniversary';
  fields.enabled.checked = Boolean(gift?.enabled);
  if (gift?.opens_at) {
    const date = new Date(gift.opens_at);
    fields.date.value = new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
  }
  $('extras').open=Boolean(gift?.coins||gift?.card);
  $('deliverySettings').open=false;
  $('draft').hidden=share;
  goToDraftStep(gift?1:0,false);
  if(share){
    void printable(gift);
    $('print').focus({preventScroll:true});
    $('print').scrollIntoView({block:'nearest'});
  }else{
    generation++;
    $('print').hidden=true;
  }
}
$('newGift').onclick = () => {if(!pending){status('');edit(null);goToDraftStep(0);}};
$('resumeEdit').onclick = () => {if(!pending&&selected&&!selected.redeemed_at){status('');edit(selected);goToDraftStep(1);}};
$('previousStep').onclick=()=>{if(!pending&&draftStep>0){status('');goToDraftStep(draftStep-1);}};
$('draft').elements.enabled.onchange=renderDraftSummary;
$('draft').elements.date.onchange=renderDraftSummary;
function renderView() {
  const page = !account.creator && view === 'create' ? 'scan' : view;
  $('giftNav').hidden = false;
  $('entry').hidden = page !== 'scan';
  $('editor').hidden = page !== 'create';
  $('collection').hidden = page !== 'mine';
  for (const button of $('giftNav').querySelectorAll('[data-view]')) {
    button.hidden = button.dataset.view === 'create' && !account.creator;
    button.setAttribute('aria-pressed', String(button.dataset.view === page));
  }
}
function drawList(container, entries, managed) {
  const root = $(container);
  root.replaceChildren();
  if (!entries.length) root.textContent = t(managed ? 'noDrafts' : 'empty');
  for (const item of entries) {
    const button = document.createElement('button');
    button.type = 'button';
    const name=document.createElement('strong');
    name.textContent=item.title;
    button.append(name);
    if(managed)button.append(fileText('small',item.redeemed_at?'claimed':item.enabled?'ready':'draft'));
    button.onclick=()=>{
      if(pending)return;
      if(managed){status('');edit(item,true);}
      else run(()=>showGift(item));
    };
    root.append(button);
  }
}
function drawLists() {
  drawList('items',account.mine,false);
  drawList('managedItems', account.creator ? account.gifts : [],true);
}
$('giftNav').onclick = event => {
  const button = event.target.closest('[data-view]');
  if (!button || pending || !account || button.hidden) return;
  view = button.dataset.view;
  $('gift').hidden = true;
  status('');
  renderView();
  if (view !== 'scan') void stopScan().catch(()=>{});
};
async function refresh() {
  const [data,mine] = await Promise.all([rpc('list'),rpc('mine')]);
  account = {...data,creator:data.creator ?? data.admin,mine};
  showBalance();
  $('giftPartner').textContent = data.admin ? 'Julie' : 'Yisus';
  if (!account.creator && view === 'create') view = 'scan';
  renderView();
  drawLists();
}
function giftCode(value){
  const current=value.trim();
  if(/^[A-Z0-9-]{6,36}$/i.test(current))return current.toUpperCase();
  let link;
  try{link=new URL(current);}
  catch{throw Error('INVALID_GIFT_CODE');}
  const candidate=new URLSearchParams(link.hash.slice(1)).get('gift')||'';
  if(link.origin!==location.origin||link.pathname!==location.pathname||!/^[A-Z0-9-]{6,36}$/i.test(candidate))throw Error('INVALID_GIFT_CODE');
  return candidate.toUpperCase();
}
async function lookup(value) {
  const normalized=giftCode(value);
  $('gift').hidden = true;
  const gift = await rpc('preview',{code:normalized});
  code = normalized;
  $('lookup').elements.code.value=normalized;
  await showGift(gift);
}
$('lookup').onsubmit = event => {
  event.preventDefault();
  run(async()=>{await stopScan();await lookup($('lookup').elements.code.value);});
};
$('openGift').onclick = () => run(async () => {
  const gift = await rpc('redeem',{code});
  await showGift(gift);
  await refresh();
});
$('draft').onsubmit = event => {
  event.preventDefault();
  if(pending)return;
  status('');
  if(!validDraftStep())return;
  if(draftStep<2){goToDraftStep(draftStep+1);return;}
  run(async () => {
    const form=$('draft');
    const f=form.elements;
    form.inert=true;
    status('saving');
    renderDraftStep();
    try{
      const attachments=[...savedFiles];
      if (!draftCode) draftCode=crypto.randomUUID().replaceAll('-','').toUpperCase();
      const payload={
        id:selected?.id,recipient:f.recipient.value,sender_note:f.sender_note.value,title:f.title.value,body:f.body.value,
        code:f.code.value.trim()||draftCode,theme:f.theme.value,attachments,coins:Number(f.coins.value || 0),
        card:f.card.value,opens_at:f.date.value ? new Date(f.date.value).toISOString() : null,enabled:f.enabled.checked
      };
      if (pickedFiles.length) {
        const login = await client.auth.getUser();
        if (login.error) throw login.error;
        const owner=login.data.user.id;
        for (const file of pickedFiles) {
          let uploaded=uploads.get(file);
          if (!uploaded || !uploaded.path.startsWith(owner+'/')) {
            const path=owner+'/'+crypto.randomUUID();
            const result=await client.storage.from(bucket).upload(path,file,{contentType:file.type});
            if (result.error) throw result.error;
            uploaded={path,name:file.name};
            uploads.set(file,uploaded);
          }
          attachments.push(uploaded);
        }
      }
      const gift=await rpc('save',payload);
      account.gifts=[gift,...account.gifts.filter(item=>item.id!==gift.id)];
      edit(gift,true);
      drawLists();
      status('');
      printStatus('saved');
      await refresh().catch(()=>{});
    }finally{
      form.inert=false;
      renderDraftStep();
    }
  });
};
function renderCameraButton(){
  $('scan').disabled=cameraStarting||cameraStopping;
  $('scan').textContent=t(cameraStarting?'scanLoading':scanner?'stop':'scan');
}
async function stopScan() {
  cameraWanted=false;
  if(cameraStarting||cameraStopping||!scanner)return;
  const active = scanner;
  scanner = null;
  cameraStopping=true;
  renderCameraButton();
  try{
    if(active.isScanning)await active.stop();
    active.clear();
  }finally{
    cameraStopping=false;
    $('camera').hidden=true;
    renderCameraButton();
  }
}
$('scan').onclick = async () => {
  if(pending||cameraStarting||cameraStopping)return;
  status('');
  if(scanner){
    await stopScan().catch(()=>status('cameraError'));
    return;
  }
  cameraWanted=true;
  cameraStarting=true;
  renderCameraButton();
  try {
    await script('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
    if(!cameraWanted)return;
    $('camera').hidden=false;
    const active=new Html5Qrcode('camera',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128]});
    scanner=active;
    await active.start({facingMode:'environment'},{fps:8},decoded=>{
      if(!cameraWanted||scanner!==active||pending)return;
      run(async()=>{await stopScan();await lookup(decoded);});
    });
  }catch{
    if(cameraWanted)status('cameraError');
    cameraWanted=false;
  }finally{
    cameraStarting=false;
    if(!cameraWanted)await stopScan().catch(()=>{});
    if(!scanner)$('camera').hidden=true;
    renderCameraButton();
  }
};
window.addEventListener('pagehide',()=>{void stopScan().catch(()=>{});});
async function start() {
  const info = await client.auth.getSession();
  if (info.error) throw info.error;
  $('login').hidden = Boolean(info.data.session);
  if (!info.data.session) return;
  await refresh();
  if (code) await lookup(code);
}
$('login').onsubmit = event => {
  event.preventDefault();
  run(async () => {
    const f = $('login').elements;
    try {
      const result = await client.auth.signInWithPassword({email:config.loginEmails[f.profile.value],password:f.password.value});
      if (result.error) throw result.error;
      await start();
    } finally {f.password.value='';}
  });
};
run(start);
</script>
