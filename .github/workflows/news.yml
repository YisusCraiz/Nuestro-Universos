name: Registrar noticias
on:
  push:
    branches: [main]
    paths-ignore: [news.json]
permissions:
  contents: write
concurrency:
  group: universe-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-news.cjs
      - name: Guardar noticia
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: registrar noticia de actualización'
            git push
          fi
